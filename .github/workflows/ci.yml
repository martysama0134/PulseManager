name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: MSVC
            build: cl /std:c++20 /EHsc /O2 /W4 /WX /Fe:test_runner.exe test.cpp
            run: ./test_runner.exe
          - os: ubuntu-latest
            name: GCC
            build: g++ -std=c++20 -O2 -Wall -Wextra -Werror -o test_runner test.cpp
            run: ./test_runner
          - os: ubuntu-latest
            name: Clang
            build: clang++ -std=c++20 -O2 -Wall -Wextra -Werror -o test_runner test.cpp
            run: ./test_runner

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: ${{ matrix.build }}

      - name: Test
        run: ${{ matrix.run }}
